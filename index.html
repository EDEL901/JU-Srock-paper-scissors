<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주 선생과 함께 가위바위보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{ --bg:#000; --fg:#fff; --dim:#8a8a8a; }
*{box-sizing:border-box}
html{image-rendering:pixelated}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
  font-family:"Galmuri11","Galmuri9","DotGothic16","Apple SD Gothic Neo","Noto Sans KR",monospace;
  display:flex;justify-content:center;padding:14px;
  /* 1비트 디더링 배경 */
  background-image:
    conic-gradient(#fff 25%,#000 0 50%,#fff 0 75%,#000 0);
  background-size:4px 4px;
  background-color:#000}
body::before{content:"";position:fixed;inset:0;background:#000;opacity:.88;pointer-events:none}
main{position:relative;width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:2px 0;text-align:center;letter-spacing:.2em;background:#000;padding:6px 0;
  border-top:3px solid #fff;border-bottom:3px solid #fff}
/* 이중 테두리 프레임 */
.box{background:#000;border:3px solid #fff;outline:3px solid #000;box-shadow:0 0 0 6px #fff;margin:6px;padding:10px}
.stage{aspect-ratio:3/4;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.stage img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.mono .stage img{filter:grayscale(1) contrast(1.6)}
.mono .hands img,.mono .result img{filter:grayscale(1) contrast(1.6)}
.mono .stage img {
  filter: grayscale(1) contrast(1.6);
}

.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,.28) 0 1px,
    transparent 1px 3px
  );
}
.placeholder{color:var(--fg);text-align:center;font-size:14px;line-height:1.8;padding:16px;border:3px dashed #fff;margin:16px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:16px;padding:0 6px}
.progress{display:flex;gap:6px}
.dot{width:14px;height:14px;background:#000;border:2px solid #fff}
.dot.on{background:#fff}
.lives{letter-spacing:3px}
.result{display:flex;justify-content:center;gap:24px;font-size:40px;min-height:52px;align-items:center;filter:grayscale(1) contrast(1.4)}
.result .vs{font-size:16px}
.dialog{min-height:6em;font-size:16px;line-height:1.7;padding-top:22px;position:relative}
.name{position:absolute;top:-16px;left:8px;background:#fff;color:#000;padding:1px 12px;font-size:14px}
.cursor{display:inline-block;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hands{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 6px}
button{font:inherit;cursor:pointer;color:#fff;background:#000;border:3px solid #fff;padding:10px 0;font-size:16px;
  box-shadow:4px 4px 0 #fff}
button:hover:not(:disabled){background:#fff;color:#000}
button:hover:not(:disabled) img{filter:invert(1) grayscale(1)}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 #fff}
button:focus-visible{outline:3px dotted #fff;outline-offset:4px}
button:disabled{opacity:.4;cursor:default}
.hands button img{height:44px;display:block;margin:0 auto 4px;image-rendering:pixelated}
.hands button .e{font-size:32px;display:block;filter:grayscale(1)}
#restart{display:none;background:#fff;color:#000;box-shadow:4px 4px 0 #666;margin:0 6px}
#restart:hover{background:#000;color:#fff}
@media (prefers-reduced-motion: reduce){.cursor{animation:none}}

#next{display:none;margin:0 6px}
.narr .name{visibility:hidden}
.narr #text{font-style:italic;color:#ddd}
.dialog{cursor:default}
.hud{gap:8px}
.score{letter-spacing:2px;white-space:nowrap}
#mute{position:fixed;top:8px;right:8px;z-index:5;margin:0;padding:4px 10px;font-size:13px;box-shadow:2px 2px 0 #fff}
</style>
</head>
<body>
<button id="mute" aria-label="소리 켜기/끄기">♪ ON</button>
<main>
  <h1 id="title"></h1>
  <div class="box stage" id="stage"></div>
  <div class="bar hud"><div id="round"></div><div class="score" id="score"></div></div>
  <div class="result" id="result" aria-live="polite"></div>
  <div class="box dialog" id="dialog"><span class="name" id="name"></span><span id="text"></span><span class="cursor">▼</span></div>
  <div class="hands" id="hands"></div>
  <button id="next">다음 ▶</button>
  <button id="restart">다시 하기</button>
</main>

<script>
/* ============================================================
   ★ 여기만 고치면 돼요 ★
   3판 승부 = 각 판마다 가위바위보 3회, 총 3판 진행
   그림: index.html 옆 images 폴더 (없으면 '그림 자리' 상자가 떠요)
   대사: 아래 DIALOGUE에 직접 쓰기
   ============================================================ */
const CONFIG = {
  title: "주 선생과 함께 가위바위보",
  characterName: "서문주",   // 대사창 이름표
  typeSpeed: 28,           // 글자 나오는 속도(ms). 0이면 한 번에 표시
  mono: false,              // true: 그림을 자동으로 흑백+고대비 처리. 이미 1비트로 그렸다면 false
  winsToClear: 2,          // 한 판에서 필요한 승수(3회 중 2승이면 해당 판 승리)

  // 음악: 기본은 코드로 만든 도트(칩튠) 음악이에요. 직접 만든 음악 파일이 있으면 경로를 넣으세요. 예: "audio/intro.mp3"
  // 비워두면("") 기본 도트 음악이 나와요. 브라우저 규칙상 첫 클릭 후부터 소리가 나요.
  music: {
    volume: 0.5,             // 0 ~ 1
    files: { intro: "", play: "", win: "", lose: "" }
  },

  introImg: "images/intro.png",     // 인트로 그림
  stages: [                          // 게임 진행 단계 그림
    "images/stage0.png",
    "images/stage1.png",
    "images/stage2.png",
    "images/stage3.png"
  ],
  winImg:  "images/ending_win.png",  // 엔딩(내가 이김) 그림
  loseImg: "images/ending_lose.png", // 엔딩(내가 짐) 그림

  hands: {
    rock:     { label: "바위", emoji: "✊", img: "images/rock.png" },
    paper:    { label: "보",   emoji: "✋", img: "images/paper.png" },
    scissors: { label: "가위", emoji: "✌️", img: "images/scissors.png" }
  },

  // 의상 단계별 가위·바위·보 이미지 세트.
  // stage0 = 게임 시작 복장, stage1 = 첫 판에서 캐릭터가 져서 바뀐 복장 등.
  // 각 단계마다 가위·바위·보 이미지 3장이 필요해요.
  characterHandSets: [
    {
      rock: "images/character_stage0_rock.png",
      paper: "images/character_stage0_paper.png",
      scissors: "images/character_stage0_scissors.png"
    },
    {
      rock: "images/character_stage1_rock.png",
      paper: "images/character_stage1_paper.png",
      scissors: "images/character_stage1_scissors.png"
    },
    {
      rock: "images/character_stage2_rock.png",
      paper: "images/character_stage2_paper.png",
      scissors: "images/character_stage2_scissors.png"
    },
    {
      rock: "images/character_stage3_rock.png",
      paper: "images/character_stage3_paper.png",
      scissors: "images/character_stage3_scissors.png"
    }
  ]
};

/* 대사 쓰는 법
   - [ "첫 줄", "둘째 줄", ... ] : intro / endingWin / endingLose 는 쓴 순서대로 한 줄씩 나와요 (클릭하면 다음 줄).
   - 그 외 칸은 여러 줄을 넣으면 그중 하나가 랜덤으로 나와요.
   - 줄 맨 앞에 * 를 붙이면 이름표 없는 지문(나레이션)으로 나와요. 예: "*문이 닫히는 소리가 들렸다." */
const DIALOGUE = {
  intro: [
    "*주 선생이 갑자기 가위바위보 승부를 걸어왔다.",
    "얌마! 거기 너! 고구려의 명운을 걸고 승부다.",
    "지는 쪽이… 옷 벗기야. 야구권 알지? 그럼 시작!"
  ],
  start:   ["안 내면 진 거."],
  draw:    ["엥, 찌찌뽕!"],

  // 한 번의 가위바위보 결과 대사
  playerWins:  { 1: ["-이겼다!- 하아. 뭐, 됐어."], 2: ["-연속으로 이겼다!- 뭐야, 사기야. 이 자식. 죽고 싶냐?"] },
  playerLoses: { 1: ["-졌다…- 에이… 재미없다. (히죽)"], 2: ["-연속으로 졌다…- 으응? 일부러 져 주는 거? 설마 벗고 싶어서…?!"] },

  // 각 판에서 3회가 끝난 뒤 나오는 대사
  matchEnd: {
    1: ["아직까진 여유지? 싸게싸게 가자고."],
    2: ["후… 슬슬 승부가 난다구."],
    3: ["끝끝."]
  },
  matchWin: ["-서문주가 벗는다.- 칫… 안 그래도 더웠거든."],
  matchLose: ["-당신이 벗는다.- 바보. 하하하. 아 더러워."],
  matchDraw: ["-무승부.- 야! 난 운명 안 믿는다고."],
  nextMatch: {
    2: ["으음."],
    3: ["(하품)"]
  },

  endingWin:  ["*서문주와의 야구권에서 승리했다.", "쩝… 줴줴이야. 여기서 더 벗을 줄 알고? 겠냐, 멍청아."],
  endingLose: ["*서문주와의 야구권에서 패배했다.", "낙승이네. 이제 꼴 보기 싫으니까 옷 입어라."]
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const KEYS = ["rock","paper","scissors"];
const beats = { rock:"scissors", scissors:"paper", paper:"rock" };
const pick = a => a && a.length ? a[Math.floor(Math.random()*a.length)] : "";
const NEED = () => CONFIG.winsToClear;


/* ---------- 도트 음악 (Web Audio로 직접 합성) ---------- */
const SONGS = {
  // 인트로: 느리고 으스스한 단조
  intro:{ bpm:70,
    lead:[69,0,72,0,76,0,75,0, 74,0,72,0,71,0,0,0, 69,0,72,0,76,0,79,0, 77,0,76,0,75,0,0,0],
    bass:[45,0,0,0,45,0,0,0, 43,0,0,0,43,0,0,0, 41,0,0,0,41,0,0,0, 40,0,0,0,40,0,0,0],
    hat:[] },
  // 대결: 빠르고 불안한 아르페지오
  play:{ bpm:132,
    lead:[57,60,64,60,57,60,64,60, 55,59,62,59,55,59,62,59, 53,57,60,57,53,57,60,57, 52,56,59,56,52,56,59,56],
    bass:[33,0,33,0,33,0,33,0, 31,0,31,0,31,0,31,0, 29,0,29,0,29,0,29,0, 28,0,28,0,28,0,28,0],
    hat:[0,0,1,0,0,0,1,1] },
  // 승리 엔딩: 밝은 장조
  win:{ bpm:104,
    lead:[72,76,79,84,0,79,76,79, 74,77,81,86,0,81,77,81, 76,79,83,88,0,83,79,83, 72,76,79,84,0,0,0,0],
    bass:[48,0,48,0,53,0,53,0, 50,0,50,0,55,0,55,0, 52,0,52,0,55,0,55,0, 48,0,0,0,0,0,0,0],
    hat:[] },
  // 패배 엔딩: 느린 하강, 불협
  lose:{ bpm:56,
    lead:[69,0,0,0,68,0,0,0, 65,0,0,0,64,0,0,0, 62,0,0,0,61,0,0,0, 57,0,0,0,0,0,0,0],
    bass:[33,0,0,0,0,0,0,0, 32,0,0,0,0,0,0,0, 29,0,0,0,0,0,0,0, 28,0,0,0,0,0,0,0],
    hat:[] }
};
const midi = n => 440*Math.pow(2,(n-69)/12);
const A8 = {
  ctx:null, master:null, on:true, want:null, step:0, nextT:0, timer:null, audioEl:null, noiseBuf:null,
  unlock(){
    if(!this.ctx){
      const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
      this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = CONFIG.music.volume;
      this.master.connect(this.ctx.destination);
      const n = this.ctx.sampleRate*0.2, b = this.ctx.createBuffer(1,n,this.ctx.sampleRate), d = b.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
      this.noiseBuf = b;
    }
    if(this.ctx.state === "suspended") this.ctx.resume();
    this.start();
  },
  song(name){ this.want = name; this.start(); },
  stop(){ clearInterval(this.timer); this.timer = null; if(this.audioEl){ this.audioEl.pause(); this.audioEl = null; } },
  start(){
    this.stop();
    if(!this.ctx || !this.on || !this.want) return;
    const f = CONFIG.music.files[this.want];
    if(f){
      const a = new Audio(f); a.loop = true; a.volume = CONFIG.music.volume;
      a.onerror = () => { this.audioEl = null; this.synth(); };
      a.play().catch(()=>{}); this.audioEl = a; return;
    }
    this.synth();
  },
  synth(){
    const s = SONGS[this.want]; if(!s) return;
    this.step = 0; this.nextT = this.ctx.currentTime + 0.05;
    const sd = 60/s.bpm/2;
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      while(this.nextT < this.ctx.currentTime + 0.25){
        const t = this.nextT, L = s.lead[this.step % s.lead.length], B = s.bass[this.step % s.bass.length];
        if(L) this.tone(midi(L), t, sd*1.6, "square", 0.16);
        if(B) this.tone(midi(B), t, sd*1.8, "triangle", 0.3);
        if(s.hat.length && s.hat[this.step % s.hat.length]) this.hat(t);
        this.nextT += sd; this.step++;
      }
    }, 50);
  },
  tone(f,t,d,type,v){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+d+0.02);
  },
  hat(t){
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const g = this.ctx.createGain(), hp = this.ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 6000;
    g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    src.connect(hp); hp.connect(g); g.connect(this.master); src.start(t); src.stop(t+0.06);
  },
  sfx(n){
    if(!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    const seq = { select:[[880,0]], blip:[[520,0]], draw:[[440,0],[440,.1]],
      win:[[523,0],[659,.08],[784,.16],[1047,.24]], lose:[[392,0],[330,.12],[262,.24],[196,.36]] }[n];
    seq.forEach(([f,o]) => this.tone(f, t+o, n==="blip" ? 0.04 : 0.1, "square", n==="blip" ? 0.06 : 0.18));
  },
  toggle(){ this.on = !this.on; if(this.on) this.start(); else this.stop(); }
};

let phase, pw, cw, queue, cb, typing, full, typer, busy;
let matchNo = 1, throwsInMatch = 0, matchPlayerWins = 0, matchCpuWins = 0, playerMatchWins = 0, cpuMatchWins = 0, outfitStage = 0;

function setImage(src){
  const box = $("stage"); box.innerHTML = "";
  if(!src){ box.innerHTML = '<div class="placeholder">그림 자리</div>'; return; }
  const im = new Image(); im.alt = "";
  im.onerror = () => { box.innerHTML = '<div class="placeholder">그림 자리<br><b>'+src+'</b></div>'; };
  im.src = src; box.appendChild(im);
}

// 현재 의상 단계(outfitStage)에 맞는 가위·바위·보 이미지를 표시한다.
function setCharacterPose(key){
  const sets = CONFIG.characterHandSets || [];
  const currentSet = sets[Math.min(outfitStage, sets.length - 1)];
  const src = currentSet && currentSet[key];
  if(src) showCharacterImage(src, "의상 단계 " + (outfitStage + 1) + ", 상대가 낸 " + CONFIG.hands[key].label);
}

function showCharacterImage(src, altText){
  if(!src) return;
  const im = new Image();
  im.onload = () => {
    $("stage").innerHTML = "";
    im.alt = altText || "상대 캐릭터";
    $("stage").appendChild(im);
  };
  im.onerror = () => {}; // 해당 단계 이미지가 없으면 현재 이미지를 유지한다.
  im.src = src;
}

function setLine(line){
  const narr = line.startsWith("*");
  $("dialog").classList.toggle("narr", narr);
  full = narr ? line.slice(1) : line;
  clearInterval(typer);
  const t = $("text"); t.textContent = "";
  if(!CONFIG.typeSpeed){ t.textContent = full; typing = false; return; }
  typing = true; let i = 0;
  typer = setInterval(() => {
    t.textContent = full.slice(0, ++i);
    if(!narr && i%2===0) A8.sfx("blip");
    if(i >= full.length){ clearInterval(typer); typing = false; }
  }, CONFIG.typeSpeed);
}

function talk(lines, done){
  queue = lines.filter(Boolean); cb = done || null; busy = true;
  advance(true);
}
function advance(first){
  if(!busy) return;
  if(typing && !first){ clearInterval(typer); $("text").textContent = full; typing = false; return; }
  if(queue.length){
    setLine(queue.shift());
    if(!queue.length && !cb) busy = false;   // 일반 대사는 마지막 줄이 나오면 바로 다음 입력 가능
  } else {
    busy = false;
    const f = cb; cb = null;
    if(f) f();
  }
  controls();
}

function controls(){
  $("hands").style.display   = (phase === "play" && !busy) ? "grid" : "none";
  $("next").style.display    = busy ? "block" : "none";
  $("restart").style.display = (phase === "ending" && !busy) ? "block" : "none";
}

function hud(){
  if(phase === "play") {
    $("round").textContent = "제 "+matchNo+" 판 · "+(throwsInMatch+1)+" / 3 회";
    $("score").textContent = "이번 판 나 "+matchPlayerWins+" : "+matchCpuWins+" 상대  |  판 승리 나 "+playerMatchWins+" : "+cpuMatchWins+" 상대";
  } else {
    $("round").textContent = phase === "intro" ? "" : "끝";
    $("score").textContent = phase === "intro" ? "" : "최종 판 승리  나 "+playerMatchWins+" : "+cpuMatchWins+" 상대";
  }
}

function handView(key){
  const h = CONFIG.hands[key], s = document.createElement("span");
  s.textContent = h.emoji;
  if(h.img){
    const im = new Image(); im.alt = h.label; im.style.height = "1em"; im.style.imageRendering = "pixelated";
    im.onload = () => { s.textContent = ""; s.appendChild(im); };
    im.src = h.img;
  }
  return s;
}

function play(mine){
  if(phase !== "play" || busy) return;
  A8.sfx("select");
  const cpu = KEYS[Math.floor(Math.random()*3)];

  // 선택 직후에는 손패와 결과를 숨기고 "가위, 바위... 보!"를 보여준다.
  busy = true;
  controls();
  const r = $("result");
  r.innerHTML = "";
  $("dialog").classList.remove("narr");
  $("name").textContent = CONFIG.characterName;
  $("text").textContent = "가위, 바위...";

  setTimeout(() => {
    if(phase !== "play") return;
    $("text").textContent = "보!";
    A8.sfx("blip");

    setTimeout(() => {
      if(phase !== "play") return;
      // "보!" 순간 양쪽의 선택을 공개한다. 캐릭터 이미지는 승패를 판정한 뒤 바꾼다.
      r.innerHTML = "";
      r.appendChild(handView(mine));
      const vs = document.createElement("span"); vs.className = "vs"; vs.textContent = "VS"; r.appendChild(vs);
      r.appendChild(handView(cpu));

      throwsInMatch++;
      let lines = [];
      let outcome;
      if(mine === cpu){
        outcome = "draw";
        A8.sfx("draw");
        lines.push(pick(DIALOGUE.draw));
      } else {
        const won = beats[mine] === cpu;
        outcome = won ? "playerWins" : "playerLoses";
        if(won){ matchPlayerWins++; }
        else { matchCpuWins++; }
        A8.sfx(won ? "win" : "lose");
        lines.push(pick((won ? DIALOGUE.playerWins : DIALOGUE.playerLoses)[Math.min(won ? matchPlayerWins : matchCpuWins, 2)]));
      }
      // "보!" 순간, 현재 의상 단계에서 상대가 낸 손 포즈를 공개한다.
      setCharacterPose(cpu);
      hud();
      busy = false;

      // 3회가 끝나면 해당 판의 승패를 기록하고 판 종료 대사를 출력한다.
      if(throwsInMatch >= 3){
        let matchResult = "draw";
        if(matchPlayerWins > matchCpuWins){
          playerMatchWins++; matchResult = "win";
          // 플레이어가 판에서 이기면 상대 캐릭터는 다음 판부터 한 단계 바뀐 복장.
          outfitStage = Math.min(outfitStage + 1, (CONFIG.characterHandSets || []).length - 1);
        }
        else if(matchCpuWins > matchPlayerWins){ cpuMatchWins++; matchResult = "lose"; }
        lines.push(pick(DIALOGUE.matchEnd[matchNo]));
        lines.push(pick(matchResult === "win" ? DIALOGUE.matchWin : matchResult === "lose" ? DIALOGUE.matchLose : DIALOGUE.matchDraw));
        hud();
        if(matchNo >= 3){
          talk(lines, () => ending(playerMatchWins > cpuMatchWins));
        } else {
          talk(lines, () => {
            matchNo++;
            throwsInMatch = 0; matchPlayerWins = 0; matchCpuWins = 0;
            // 의상 단계는 초기화하지 않아요. 다음 판의 손 포즈 이미지가 새 의상을 사용합니다.
            hud();
            setImage(CONFIG.stages[Math.min(playerMatchWins, CONFIG.stages.length - 1)]);
            talk([pick(DIALOGUE.nextMatch[matchNo])]);
          });
        }
      } else {
        talk(lines);
      }
    }, 450);
  }, 650);
}
function ending(win){
  phase = "ending";
  A8.song(win ? "win" : "lose");
  $("result").innerHTML = "";
  setImage(win ? CONFIG.winImg : CONFIG.loseImg);
  hud();
  talk(win ? DIALOGUE.endingWin : DIALOGUE.endingLose);   // 마지막 줄이 나오면 '다시 하기' 표시
}

function startPlay(){
  phase = "play";
  matchNo = 1; throwsInMatch = 0; matchPlayerWins = 0; matchCpuWins = 0; playerMatchWins = 0; cpuMatchWins = 0; outfitStage = 0;
  A8.song("play");
  setImage(CONFIG.stages[Math.min(playerMatchWins, CONFIG.stages.length - 1)]);
  hud();
  talk([pick(DIALOGUE.start)]);
}

function init(){
  phase = "intro"; pw = 0; cw = 0; busy = false; matchNo = 1; throwsInMatch = 0; matchPlayerWins = 0; matchCpuWins = 0; playerMatchWins = 0; cpuMatchWins = 0; outfitStage = 0;
  A8.song("intro");
  document.title = CONFIG.title;
  document.body.classList.toggle("mono", !!CONFIG.mono);
  $("title").textContent = CONFIG.title;
  $("name").textContent = CONFIG.characterName;
  $("result").innerHTML = "";
  setImage(CONFIG.introImg);
  hud();
  talk(DIALOGUE.intro, startPlay);
}

KEYS.forEach(k => {
  const h = CONFIG.hands[k], b = document.createElement("button");
  b.innerHTML = '<span class="e">'+h.emoji+'</span>'+h.label;
  if(h.img){
    const im = new Image(); im.alt = "";
    im.onload = () => b.querySelector(".e").replaceWith(im);
    im.src = h.img;
  }
  b.onclick = () => play(k);
  $("hands").appendChild(b);
});
$("next").onclick = () => advance();
$("dialog").onclick = () => advance();
$("restart").onclick = init;
$("mute").onclick = () => { A8.toggle(); $("mute").textContent = A8.on ? "♪ ON" : "♪ OFF"; };
// 브라우저는 첫 클릭/키 입력 뒤에야 소리를 허용해요
let unlocked = false;
["pointerdown","keydown"].forEach(e => addEventListener(e, () => { if(!unlocked){ unlocked = true; A8.unlock(); } }));
init();
</script>
</body>
</html>
